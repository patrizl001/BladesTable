[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blades-table"
version = "0.1.0"
description = "Local virtual tabletop + MCP server for running Blades of Ether solo with Claude as the Architect"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
boe = "boe.cli:main"

[tool.setuptools.packages.find]
include = ["boe*"]

[tool.setuptools.package-data]
boe = ["data/*", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
